name: C3S seasonal outlook (Lampang)

# C3S publishes new seasonal forecasts on the 13th of each month at 12 UTC.
# Run on the 14th (and again on the 16th in case the CDS queue was slow).
on:
  schedule:
    - cron: '0 2 14,16 * *'
  workflow_dispatch:
    inputs:
      init:
        description: 'Start month YYYY-MM (empty = latest release)'
        required: false
        default: ''
      centres:
        description: 'Comma-separated centres (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: c3s-seasonal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-c3s.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-c3s.txt

      # Hindcasts do not change for a given system + start month, so keep them
      # between runs; only the small forecast file is new each month.
      - name: Restore hindcast cache
        uses: actions/cache@v4
        with:
          path: .c3s_cache
          key: c3s-hc-${{ github.run_id }}
          restore-keys: c3s-hc-

      - name: Build data/c3s_seasonal.json
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.init }}" ]; then ARGS="$ARGS --init ${{ inputs.init }}"; fi
          if [ -n "${{ inputs.centres }}" ]; then ARGS="$ARGS --centres ${{ inputs.centres }}"; fi
          python scripts/c3s_seasonal_lampang.py $ARGS
          # forecast files are tiny but should not pile up in the cache
          rm -f .c3s_cache/*_fc_*.grib

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/c3s_seasonal.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update C3S seasonal outlook ($(python -c "import json;print(json.load(open('data/c3s_seasonal.json'))['init'])"))"
          git push
